---
- name: Verification du serveur web
  hosts: web
  become: true

  tasks:

    - name: Verifier que Nginx est actif
      ansible.builtin.command:
        cmd: systemctl is-active nginx
      register: nginx_status
      changed_when: false
      failed_when: nginx_status.stdout != "active"

    - name: Verifier la presence de la page HTML
      ansible.builtin.stat:
        path: "{{ web_root }}/index.html"
      register: site_file

    - name: Confirmer la presence du site
      ansible.builtin.assert:
        that:
          - site_file.stat.exists
        success_msg: "Le site web est present."
        fail_msg: "Le site web est introuvable."
